<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <!-- Instant Meta Refresh -->
    <meta http-equiv="refresh" content="0; url=https://www.facebook.com/your-page-here" />
    <!-- JavaScript Fallback/Instant Redirect -->
    <script>
      window.location.replace("https://www.facebook.com/newgenmobile/");
    </script>
  </head>
  <body>
    <p>Redirecting to Facebook...</p>
    <p>If you are not redirected automatically, <a href="https://www.facebook.com/newgenmobile/">click here</a>.</p>
  </body>
</html>
